<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17263b">
<title>漫画の新刊チェッカー</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101827;color:#f2f5fa}
*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:28px 18px 70px}
h1{font-size:1.65rem;margin:0 0 8px}p{line-height:1.6}.muted{color:#a9b6ca}
.registration{border:1px solid #344259;background:#1b293d;border-radius:14px;padding:18px;margin:22px 0}
.registration h2{font-size:1.08rem;margin:0 0 10px}.registration form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
input,select,textarea{background:#101827;color:#f2f5fa;border:1px solid #63708a;border-radius:9px;padding:11px 12px;font:inherit;min-width:0}
input{flex:1;min-width:170px}.registration textarea{flex:0 0 100%;min-height:116px;resize:vertical}.hint{font-size:.86rem;color:#a9b6ca;margin:9px 0 0}
.searchbar{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 12px}.searchbar input{flex:2}
.searchbar select{flex:1}.count{font-size:.85rem;color:#a9b6ca}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}
button{background:#376de3;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.card{border:1px solid #344259;background:#1b293d;border-radius:14px;padding:20px;margin:14px 0}
.card h2{font-size:1.13rem;margin:0 0 10px}.row{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.value{font-size:1.2rem;font-weight:700}.warn{color:#ffce7b}.ok{color:#90deb2}
a{color:#91b8ff}small{color:#a9b6ca}footer{margin-top:28px;font-size:.88rem;color:#a9b6ca}
</style>
</head>
<body><main>
<h1>📚 漫画の新刊チェッカー</h1>
<p class="muted">登録した漫画の最新巻と配信開始日をまとめて確認。</p>
<section class="registration" aria-labelledby="register-title">
<h2 id="register-title">作品を登録</h2>
<form id="register-form">
<textarea id="series-id" name="series-id" rows="4" autocomplete="off" spellcheck="false" placeholder="BOOK☆WALKER シリーズID（1行に1件）&#10;例：310137&#10;457249" aria-label="BOOK☆WALKERシリーズID（1行に1件、最大30行）" required></textarea>
<button type="submit">登録に進む</button>
</form>
<p class="hint">シリーズIDは1行に1件、最大30件入力できます。登録済みIDや入力内の重複は一括登録時に自動スキップします。GitHubの登録確認画面で「Submit new issue」を押すと登録処理が始まります。登録できるのはリポジトリ所有者のみです。</p>
</section>
<div class="searchbar"><input id="search" type="search" placeholder="作品名を検索" aria-label="作品名を検索"><select id="sort" aria-label="並び替え"><option value="name">作品名順（日本語）</option><option value="date">配信日の新しい順</option><option value="volume">巻数の多い順</option></select></div>
<div id="count" class="count"></div>
<div class="toolbar"><button id="reload">表示を更新</button><span id="updated" class="muted">読み込み中…</span></div>
<div id="books" aria-live="polite"></div>
<footer>情報源：BOOK☆WALKER。自動取得は原則1日1回。配信予定日の取得にも対応しています。作品登録はGitHubで確定してください。五十音の見出し分けは今後、読み仮名データの整備後に実装します。</footer>
</main>
<script>
const books=document.querySelector('#books');
const updated=document.querySelector('#updated');
const button=document.querySelector('#reload');
const search=document.querySelector('#search');
const sort=document.querySelector('#sort');
const count=document.querySelector('#count');
let allBooks=[];
const collator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});
document.querySelector('#register-form').addEventListener('submit',event=>{
 event.preventDefault();
 const ids=document.querySelector('#series-id').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 if(!ids.length){alert('シリーズIDを入力してください。');return;}
 if(ids.length>30){alert('一度に入力できるのは最大30件です。');return;}
 if(ids.some(sid=>!/^[1-9][0-9]{0,9}$/.test(sid))){alert('シリーズIDは1行に1件、先頭0を除く1～10桁の数字で入力してください。');return;}
 const bulk=ids.length>1;
 const sid=ids[0];
 if(!bulk&&allBooks.some(item=>String(item.id)===sid)){alert('このシリーズIDはすでに登録されています。');return;}
 const title=bulk?'manga-register: bulk':'manga-register: '+sid;
 const body=bulk?ids.join('\n'):'BOOK☆WALKERのシリーズID '+sid+' を登録します。\n\nシリーズページ: https://bookwalker.jp/series/'+sid+'/list/';
 const params=new URLSearchParams({title,body});
 window.open('https://github.com/cimavip5/manga-checker/issues/new?'+params.toString(),'_blank','noopener,noreferrer');
});
function render(){
 const query=search.value.trim().normalize('NFKC').toLocaleLowerCase('ja');
 const list=allBooks.filter(item=>(item.name||'').normalize('NFKC').toLocaleLowerCase('ja').includes(query));
 list.sort((a,b)=>sort.value==='date'
   ?(b.release_date||'').localeCompare(a.release_date||'')||collator.compare(a.name,b.name)
   :sort.value==='volume'?(b.volume||0)-(a.volume||0)||collator.compare(a.name,b.name)
   :collator.compare(a.name,b.name));
 count.textContent=list.length+'作品を表示 / 登録 '+allBooks.length+'作品';
 books.replaceChildren();
 if(!list.length){books.append(el('p','muted',allBooks.length?'該当する作品がありません。':'登録作品がありません。'));return;}
 for(const item of list){
   const card=el('article','card');
   card.append(el('h2','',item.name));
   const row=el('div','row');
   const left=el('div');left.append(el('div','muted','最新巻'),el('div','value',item.volume==null?'未取得':item.volume+'巻'));
   const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
   const upcoming=item.release_date && item.release_date>today;
   const right=el('div');right.append(el('div','muted',upcoming?'配信予定日':'配信開始日'),el('div','value',item.release_date||'未取得'));
   row.append(left,right);card.append(row);
   if(item.url){const link=el('a','', 'BOOK☆WALKERで見る ↗');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';card.append(link);}
   if(item.status!=='ok')card.append(el('p','warn',item.status==='stale'?'取得失敗：前回の情報を表示中':item.status==='date_missing'?'配信開始日を取得できませんでした':'取得失敗：'+(item.error||'原因不明')));
   books.append(card);
 }
}
search.addEventListener('input',render);
sort.addEventListener('change',render);
function el(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;}
async function load(){
 button.disabled=true;
 try{
  const response=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  updated.textContent=data.updated_at?'最終取得：'+new Date(data.updated_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'初回の自動取得待ち';
  allBooks=Array.isArray(data.books)?data.books:[];
  render();
 }catch(e){updated.textContent='読み込み失敗';books.replaceChildren(el('p','warn',String(e)));}
 finally{button.disabled=false;}
}
button.addEventListener('click',load);load();
</script></body></html>
