<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17263b">
<title>漫画の新刊チェッカー</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101827;color:#f2f5fa}
*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:28px 18px 70px}
h1{font-size:1.65rem;margin:0 0 8px}p{line-height:1.6}.muted{color:#a9b6ca}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}
button{background:#376de3;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.card{border:1px solid #344259;background:#1b293d;border-radius:14px;padding:20px;margin:14px 0}
.card h2{font-size:1.13rem;margin:0 0 10px}.row{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.value{font-size:1.2rem;font-weight:700}.warn{color:#ffce7b}.ok{color:#90deb2}
a{color:#91b8ff}small{color:#a9b6ca}footer{margin-top:28px;font-size:.88rem;color:#a9b6ca}
</style>
</head>
<body><main>
<h1>📚 漫画の新刊チェッカー</h1>
<p class="muted">登録した漫画の最新巻と配信開始日をまとめて確認。</p>
<div class="toolbar"><button id="reload">表示を更新</button><span id="updated" class="muted">読み込み中…</span></div>
<div id="books" aria-live="polite"></div>
<footer>情報源：BOOK☆WALKER。自動取得は原則1日1回。発売予定日の取得は今後の実装対象です。作品の追加は現在GitHubの series.json から行います。</footer>
</main>
<script>
const books=document.querySelector('#books');
const updated=document.querySelector('#updated');
const button=document.querySelector('#reload');
function el(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;}
async function load(){
 button.disabled=true;
 try{
  const response=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  updated.textContent=data.updated_at?'最終取得：'+new Date(data.updated_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'初回の自動取得待ち';
  books.replaceChildren();
  if(!data.books?.length){books.append(el('p','muted','取得結果はまだありません。GitHub Actionsを実行してください。'));return;}
  for(const item of data.books){
   const card=el('article','card');
   card.append(el('h2','',item.name));
   const row=el('div','row');
   const left=el('div');left.append(el('div','muted','最新巻'),el('div','value',item.volume==null?'未取得':item.volume+'巻'));
   const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
   const upcoming=item.release_date && item.release_date>today;
   const right=el('div');right.append(el('div','muted',upcoming?'配信予定日':'配信開始日'),el('div','value',item.release_date||'未取得'));
   row.append(left,right);card.append(row);
   if(item.url){const link=el('a','', 'BOOK☆WALKERで見る ↗');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';card.append(link);}
   if(item.status!=='ok')card.append(el('p','warn',item.status==='stale'?'取得失敗：前回の情報を表示中':item.status==='date_missing'?'配信開始日を取得できませんでした':'取得失敗：'+(item.error||'原因不明')));
   books.append(card);
  }
 }catch(e){updated.textContent='読み込み失敗';books.replaceChildren(el('p','warn',String(e)));}
 finally{button.disabled=false;}
}
button.addEventListener('click',load);load();
</script></body></html>
