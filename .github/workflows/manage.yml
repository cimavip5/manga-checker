name: Manage manga ownership and registration
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: manga-series-writes
  cancel-in-progress: false
jobs:
  manage:
    if: ${{ github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'manga-owned: ') || startsWith(github.event.issue.title, 'manga-remove: ')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update series management data
        env:
          MANGA_MANAGEMENT_TITLE: ${{ github.event.issue.title }}
        run: python scripts/manage.py
      - name: Save management changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series.json data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manga ownership or remove series"
            git pull --rebase
            git push
          fi
      - name: Close completed request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "作品管理データの更新が完了しました。"
