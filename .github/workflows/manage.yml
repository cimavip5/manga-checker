name: Manage manga ownership and registration
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
concurrency:
  group: manga-series-writes
  cancel-in-progress: false
jobs:
  manage:
    if: >-
      ${{ github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'manga-owned: ') || startsWith(github.event.issue.title, 'manga-remove: ') || github.event.issue.title == 'manga-batch: apply') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update series management data (legacy)
        if: "${{ github.event.issue.title != 'manga-batch: apply' }}"
        env:
          MANGA_MANAGEMENT_TITLE: ${{ github.event.issue.title }}
          MANGA_MANAGEMENT_BODY: ${{ github.event.issue.body }}
        run: python scripts/manage.py
      - name: Apply mixed manga management batch
        id: mixed
        if: "${{ github.event.issue.title == 'manga-batch: apply' }}"
        env:
          MANGA_MANAGEMENT_TITLE: ${{ github.event.issue.title }}
          MANGA_MANAGEMENT_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/manage_batch.py
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from manage_batch import parse_operations
          operations = parse_operations(os.environ["MANGA_MANAGEMENT_BODY"])
          has_add = any(action == "add" for action, _, _ in operations)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_add=" + str(has_add).lower() + "\n")
          PY
      - name: Update latest manga data for newly registered series
        if: steps.mixed.outputs.has_add == 'true'
        run: python scripts/update.py
      - name: Save management changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series.json data.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply manga management changes"
            git pull --rebase
            git push
          fi
      - name: Close completed request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "作品管理データの更新が完了しました。"
